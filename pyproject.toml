[project]
name = "file-age-retention"
version = "0.1.0"
description = "Deletes files in a directory older than a given age threshold, optionally dry-run, with a report."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
